name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: pnpm/action-setup reads it from the "packageManager"
      # field in package.json, keeping a single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: pnpm test:security-rules

  functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: pnpm/action-setup reads it from the "packageManager"
      # field in package.json, keeping a single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sfvga/shared-validation build
      - run: pnpm --filter @sfvga/qr-crypto build
      - run: pnpm --filter @sfvga/functions test
